<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reminders</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Reminders">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111315">
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --panel-2: #f0f0ec; --line: #e3e3dd;
  --text: #1b1d1f; --muted: #6b6f72; --faint: #9a9ea1;
  --accent: #1f7a5a; --accent-soft: #e2f1ea; --accent-text: #ffffff;
  --danger: #b4362c; --danger-soft: #fbe9e7; --warn: #a3620a; --warn-soft: #fbf0dc;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111315; --panel: #191c1f; --panel-2: #20242700; --line: #2a2f33;
    --text: #e9ebec; --muted: #9aa1a6; --faint: #6c7378;
    --accent: #3fb68a; --accent-soft: #173a2e; --accent-text: #0b1f17;
    --danger: #f07167; --danger-soft: #3a1c1a; --warn: #f0b45a; --warn-soft: #3a2c14;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  :root { --panel-2: #202427; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Noto Sans Arabic", sans-serif;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; padding-top: calc(12px + env(safe-area-inset-top, 8px)); padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
html { -webkit-text-size-adjust: 100%; }
* { -webkit-tap-highlight-color: transparent; }
.hidden { display: none !important; }

/* header */
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.hello { font-size: 22px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
.sub { color: var(--muted); margin-top: 2px; font-size: 14px; }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { color: var(--text); background: var(--panel); }
.icon-btn svg { width: 18px; height: 18px; }

/* summary chips */
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.chip b { color: var(--text); font-weight: 600; }
.chip.over { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.over b { color: var(--danger); }

/* composer */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.composer { padding: 6px; margin-bottom: 22px; }
.composer .row { display: flex; gap: 6px; align-items: center; }
.composer input.title { flex: 1; border: 0; background: transparent; padding: 10px 10px; outline: none; font-size: 16px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; font-weight: 550; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--panel-2); }
.btn.danger { color: var(--danger); border-color: transparent; background: transparent; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.more { padding: 4px 8px 8px; display: grid; gap: 10px; }
textarea { width: 100%; resize: vertical; min-height: 64px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--bg); outline: none; }
textarea:focus, .field input:focus, .field select:focus, .login input:focus { border-color: var(--accent); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.preset:hover { color: var(--text); }
.preset.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.fields { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 160px; }
.field input, .field select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); outline: none; font-size: 14px; color: var(--text); min-width: 0; width: 100%; }
.actions { display: flex; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }

/* list */
.group { margin-bottom: 20px; }
.group h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 650; margin: 0 4px 8px; display: flex; gap: 6px; align-items: center; }
.group h2 .n { color: var(--muted); font-weight: 500; }
.group.over h2 { color: var(--danger); }
.list { overflow: hidden; }
.item { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
.item:first-child { border-top: 0; }
.item.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%,40% { background: var(--accent-soft); } 100% { background: transparent; } }
.check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); background: transparent; margin-top: 1px; display: grid; place-items: center; padding: 0; }
.check:hover { border-color: var(--accent); }
.check svg { width: 12px; height: 12px; opacity: 0; color: var(--accent-text); }
.item.done .check { background: var(--accent); border-color: var(--accent); }
.item.done .check svg { opacity: 1; }
.body { flex: 1; min-width: 0; cursor: pointer; }
.t { font-weight: 550; overflow-wrap: anywhere; }
.item.done .t { color: var(--faint); text-decoration: line-through; font-weight: 450; }
.d { color: var(--muted); font-size: 13.5px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.tag.over { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.tag.soon { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.edit { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; background: var(--panel); }
.edit:first-child { border-top: 0; }
.edit input.title { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--bg); outline: none; width: 100%; font-weight: 550; }
.edit input.title:focus { border-color: var(--accent); }
.edit .actions { justify-content: space-between; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty .big { font-size: 17px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
details.done-group summary { cursor: pointer; list-style: none; }
details.done-group summary::-webkit-details-marker { display: none; }

/* banner + toast */
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 14px; margin-bottom: 16px; border-radius: 14px; background: var(--accent); color: var(--accent-text); box-shadow: var(--shadow); }
.banner .bt { flex: 1; min-width: 0; }
.banner b { display: block; overflow-wrap: anywhere; }
.banner .btn { background: rgba(255,255,255,.18); border-color: transparent; color: inherit; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 20; max-width: calc(100% - 32px); }

/* login + settings */
.login { max-width: 360px; margin: 12vh auto 0; text-align: center; padding: 0 16px; }
.login .logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 14px; display: block; }
.login h1 { font-size: 22px; margin: 0 0 4px; }
.login p { color: var(--muted); margin: 0 0 18px; }
.login input { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; outline: none; margin-bottom: 10px; font-size: 16px; }
.login .btn { width: 100%; padding: 11px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
.settings { padding: 16px; margin-bottom: 22px; display: grid; gap: 14px; }
.settings h3 { margin: 0; font-size: 15px; }
.settings p { margin: 0; color: var(--muted); font-size: 14px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.status.ok { color: var(--accent); } .status.ok .dot { background: var(--accent); }
.status.bad { color: var(--warn); } .status.bad .dot { background: var(--warn); }
.sep { height: 1px; background: var(--line); }
a { color: var(--accent); }

/* AI + morning plan */
.ai-note { font-size: 13.5px; color: var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 8px 11px; }
.ai-note.warn { color: var(--warn); background: var(--warn-soft); }
.btn.busy { opacity: .75; pointer-events: none; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.time-in { border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; background: var(--bg); outline: none; font-size: 15px; }
.time-in:focus { border-color: var(--accent); }

/* view tabs */
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 14px; }
.tab { border: 0; background: transparent; border-radius: 9px; padding: 7px 16px; font-weight: 550; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.tab svg { width: 16px; height: 16px; }
.tab.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* calendar */
.cal-nav { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.cal-nav .wk-label { font-weight: 650; font-size: 16px; flex: 1; text-align: center; }
.cal-nav .icon-btn { width: 36px; height: 36px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.day { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center; color: var(--text); }
.day .dw { font-size: 12px; color: var(--muted); }
.day .dnum { font-size: 17px; font-weight: 650; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.day.today .dnum { background: var(--accent); color: var(--accent-text); }
.day.past .dw, .day.past .dnum { opacity: .55; }
.day.today.past .dnum { opacity: 1; }
.day.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-soft); }
.dots { display: flex; gap: 3px; height: 6px; margin-top: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: block; }
.dots i.over { background: var(--danger); }
.dots i.done { background: var(--faint); opacity: .6; }
.chips { display: none; }
.daylist-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 4px 8px; }
.daylist-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
.daylist-head .count { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 4px; }
.cal-empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.nodate { color: var(--muted); font-size: 13px; margin: 12px 4px 0; }
.rep-ico { flex: none; width: 22px; height: 22px; display: grid; place-items: center; color: var(--muted); font-size: 15px; margin-top: 1px; }
.item.proj .t { font-weight: 500; }
/* wide screens: full week with task names in each column */
@media (min-width: 760px) {
  #app.wide { max-width: 1040px; }
  #app.wide .week { gap: 8px; }
  .day { align-items: stretch; padding: 8px 6px 8px; min-height: 160px; text-align: left; justify-content: flex-start; }
  .day .hd { display: flex; align-items: center; gap: 6px; padding: 0 2px 6px; }
  .day .dnum { width: 30px; height: 30px; font-size: 16px; }
  .day .dots { display: none; }
  .chips { display: flex; flex-direction: column; gap: 4px; }
  .chip2 { display: block; font-size: 12px; line-height: 1.3; padding: 5px 6px; border-radius: 7px; background: var(--accent-soft); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip2 .tm { display: block; color: var(--accent); font-weight: 600; font-size: 11px; }
  .chip2.over { background: var(--danger-soft); } .chip2.over .tm { color: var(--danger); }
  .chip2.done { background: var(--panel-2); color: var(--faint); text-decoration: line-through; }
  .chip2.done .tm { color: var(--faint); }
  .chip2.proj { background: transparent; border: 1px dashed var(--line); }
  .chip2.more { background: transparent; color: var(--muted); padding: 2px 6px; }
}
@media (max-width: 759.98px) { .day .hd { display: contents; } }

/* phones and touch screens */
@media (pointer: coarse) {
  .icon-btn { width: 42px; height: 42px; }
  .check { width: 26px; height: 26px; position: relative; }
  .check::after { content: ""; position: absolute; inset: -10px; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .preset { padding: 8px 13px; font-size: 14px; }
  .tab { padding: 9px 18px; }
}
@media (max-width: 520px) {
  .hello { font-size: 20px; }
  header { margin-bottom: 14px; }
  .tabs { display: flex; width: 100%; }
  .tab { flex: 1; justify-content: center; }
  .composer input.title { font-size: 16px; }
  .field input, .field select, textarea, .edit input.title { font-size: 16px; }
  .field input, .field select { min-height: 42px; -webkit-appearance: none; appearance: none; }
  .field { flex-basis: 100%; }
  .item { padding: 13px 12px; }
  .week { gap: 4px; }
  .day { padding: 7px 0 8px; border-radius: 10px; }
  .day .dnum { width: 30px; height: 30px; font-size: 16px; }
  .banner { flex-wrap: wrap; }
  .banner .bt { flex-basis: 100%; }
  .toast { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .actions .btn { min-height: 38px; }
}
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="login hidden">
  <img class="logo" src="/icon.svg" alt="">
  <h1>Reminders</h1>
  <p>Enter your app password to continue.</p>
  <form id="loginForm">
    <input id="pw" type="password" placeholder="App password" autocomplete="current-password" autofocus>
    <button class="btn primary" type="submit">Open</button>
  </form>
  <div class="err" id="loginErr"></div>
</div>

<!-- App -->
<div id="app" class="wrap hidden">
  <header>
    <div>
      <h1 class="hello" id="hello">Hello</h1>
      <div class="sub" id="today"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner hidden">
    <div class="bt"><small id="bannerLabel">Reminder</small><b id="bannerTitle"></b></div>
    <button class="btn small" id="bannerDone">Done</button>
    <button class="btn small" id="bannerClose">Dismiss</button>
  </div>

  <section id="settings" class="card settings hidden">
    <div>
      <h3>Phone alerts (Telegram)</h3>
      <p id="tgText">Checking…</p>
    </div>
    <div class="actions" style="justify-content:flex-start" id="tgActions"></div>
    <div class="sep"></div>
    <div>
      <h3>Morning plan</h3>
      <p id="briefText">Every day the bot sends you today's tasks, anything overdue, and a tip on what to do first.</p>
    </div>
    <div class="actions" style="justify-content:flex-start;align-items:center">
      <label class="switch"><input type="checkbox" id="briefOn"><span>Send it every day at</span></label>
      <input type="time" id="briefTime" class="time-in" value="11:00">
      <button class="btn small" id="briefTest">Send it now</button>
    </div>
    <div class="sep"></div>
    <div>
      <h3>Desktop notifications</h3>
      <p id="notifText"></p>
    </div>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn small" id="notifBtn">Allow notifications</button>
    </div>
    <div class="sep"></div>
    <div class="actions" style="justify-content:space-between">
      <p style="font-size:13px">Signed in on this device.</p>
      <button class="btn small danger" id="logoutBtn">Sign out</button>
    </div>
  </section>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>List</button>
    <button class="tab" role="tab" data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendar</button>
  </div>

  <div class="summary" id="summary"></div>

  <form class="card composer" id="composer" autocomplete="off">
    <div class="row">
      <input class="title" id="newTitle" placeholder="What do you want to remember?" dir="auto" maxlength="300">
      <button class="btn primary" type="submit" id="addBtn">Add</button>
    </div>
    <div class="more hidden" id="newMore">
      <div class="ai-note hidden" id="aiNote"></div>
      <textarea id="newDetails" placeholder="Details or context (optional)" dir="auto"></textarea>
      <div class="presets" id="newPresets"></div>
      <div class="fields">
        <label class="field">Remind me at<input type="datetime-local" id="newWhen"></label>
        <label class="field">Repeat
          <select id="newRepeat"><option value="none">Doesn't repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option></select>
        </label>
        <label class="field">Remind me before
          <select id="newLead"><option value="0">No early reminder</option><option value="10">10 min before</option><option value="30">30 min before</option><option value="60">1 hour before</option><option value="1440">1 day before</option></select>
        </label>
      </div>
    </div>
  </form>

  <div id="lists"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function () {
  'use strict';
  var KEY_STORE = 'reminders.key';
  var NAME = ''; // put your name here, e.g. 'Sara'
  var state = { key: null, tasks: [], editing: null, alerted: {}, loaded: false, offset: 0 };
  var $ = function (id) { return document.getElementById(id); };
  state.view = (function () { try { return localStorage.getItem('reminders.view') === 'cal' ? 'cal' : 'list'; } catch (_) { return 'list'; } })();
  (function () { var d = new Date(); d.setHours(0, 0, 0, 0); state.selDay = d.getTime(); d.setDate(d.getDate() - d.getDay()); state.weekStart = d.getTime(); })();

  // ---- one window at a time: a newer window closes the older one
  try {
    var born = Date.now();
    var bc = new BroadcastChannel('reminders-window');

  // ---- api
  function api(method, path, body) {

      headers: { 'authorization': 'Bearer ' + state.key, 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined

      return r.json().catch(function () { return {}; }).then(function (d) {

  }

  // ---- time helpers

  function fromLocalInput(v) { if (!v) return null; var t = new Date(v).getTime(); return isNaN(t) ? null : t; }

  function presets() {
    var n = new Date(), list = [];

    list.push({ label: 'In 1 hour', ts: now() + 3600000 - (now() % 60000) });
    if (n.getHours() < 18) list.push({ label: 'This evening', ts: at(0, 19) });
    else if (n.getHours() < 21) list.push({ label: 'Tonight 10 pm', ts: at(0, 22) });
    list.push({ label: 'Tomorrow 9 am', ts: at(1, 9) });

  // ---- render
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function renderHeader() {
    var h = new Date().getHours();
    var g = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    $('hello').textContent = NAME ? g + ', ' + NAME : g;
    renderClock();
  }
  function renderClock() {
    var d = new Date();
    $('today').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }) + '  \u00b7  ' + clock(d.getTime());
  }

  function groups() {
    var t = now(), endToday = startOfDay(t) + DAY;
    var g = { over: [], today: [], later: [], anytime: [], done: [] };
    state.tasks.forEach(function (x) {
      if (x.done) g.done.push(x);
      else if (x.remind_at == null) g.anytime.push(x);
      else if (x.remind_at <= t) g.over.push(x);
      else if (x.remind_at < endToday) g.today.push(x);
      else g.later.push(x);
    });
    g.done.sort(function (a, b) { return b.updated_at - a.updated_at; });
    return g;
  }

  function renderSummary(g) {
    var html = '';
    if (g.over.length) html += '<span class="chip over"><b>' + g.over.length + '</b> overdue</span>';
    html += '<span class="chip"><b>' + g.today.length + '</b> later today</span>';
    html += '<span class="chip"><b>' + (g.later.length) + '</b> upcoming</span>';
    if (g.anytime.length) html += '<span class="chip"><b>' + g.anytime.length + '</b> anytime</span>';
    $('summary').innerHTML = state.tasks.length ? html : '';
  }

  var LEADS = [[0, 'No early reminder'], [10, '10 min before'], [30, '30 min before'], [60, '1 hour before'], [1440, '1 day before']];
  function leadShort(m) { return m === 1440 ? '1 day' : m === 60 ? '1 hour' : m + ' min'; }
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

  function itemHtml(x) {
    if (state.editing === x.id) return editHtml(x);

      var over = x.remind_at <= now(), soon = !over && x.remind_at - now() < 3600000;
      tags += '<span class="tag' + (over ? ' over' : soon ? ' soon' : '') + '">' + esc(when(x.remind_at)) + ' · ' + esc(rel(x.remind_at)) + '</span>';

    if (x.lead_min && x.remind_at != null && !x.done) tags += '<span class="tag">🔔 ' + leadShort(x.lead_min) + ' before</span>';

      '<div class="body" data-act="edit">' +
        '<div class="t" dir="auto">' + esc(x.title) + '</div>' +
        (x.details ? '<div class="d" dir="auto">' + esc(x.details) + '</div>' : '') +
        (tags ? '<div class="meta">' + tags + '</div>' : '') +
      '</div></div>';
  }

  function editHtml(x) {
    return '<form class="edit" data-id="' + x.id + '">' +
      '<input class="title" name="title" value="' + esc(x.title) + '" dir="auto" maxlength="300" required>' +
      '<textarea name="details" placeholder="Details or context" dir="auto">' + esc(x.details) + '</textarea>' +
      '<div class="fields">' +
        '<label class="field">Remind me at<input type="datetime-local" name="when" value="' + toLocalInput(x.remind_at) + '"></label>' +
        '<label class="field">Repeat<select name="repeat">' +
          ['none', 'daily', 'weekly'].map(function (r) { return '<option value="' + r + '"' + (x.repeat === r ? ' selected' : '') + '>' + ({ none: "Doesn't repeat", daily: 'Every day', weekly: 'Every week' })[r] + '</option>'; }).join('') +
        '</select></label>' +
        '<label class="field">Remind me before<select name="lead">' +
          LEADS.map(function (l) { return '<option value="' + l[0] + '"' + ((x.lead_min || 0) === l[0] ? ' selected' : '') + '>' + l[1] + '</option>'; }).join('') +
        '</select></label>' +
      '</div>' +
      '<div class="actions"><button type="button" class="btn small danger" data-act="delete">Delete</button>' +
      '<span style="display:flex;gap:6px"><button type="button" class="btn small ghost" data-act="cancel">Cancel</button><button type="submit" class="btn small primary">Save</button></span></div>' +
    '</form>';
  }

  function section(key, title, items, extraClass) {
    if (!items.length) return '';

      '<div class="card list">' + items.map(itemHtml).join('') + '</div></div>';
  }

  function render() {
    renderHeader();
    var g = groups();
    renderSummary(g);
    renderTabs();
    if (state.view === 'cal') { $('lists').innerHTML = calHtml(); return; }
    var html = '';
    html += section('over', 'Overdue', g.over, 'over');
    html += section('today', 'Later today', g.today);
    html += section('later', 'Upcoming', g.later);
    html += section('anytime', 'Anytime', g.anytime);
    if (g.done.length) {

      html += '<details class="group done-group"' + (open || load('reminders.showDone') === '1' ? ' open' : '') + ' id="doneGroup"><summary><h2>Done <span class="n">' + g.done.length + '</span> ▾</h2></summary>' +
        '<div class="card list">' + g.done.slice(0, 50).map(itemHtml).join('') + '</div></details>';

  // ---- calendar (week view, weeks start on Sunday)

  }

  var CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  var CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

      '<span class="rep-ico" title="Repeats" aria-hidden="true">↻</span>' +

      (ws !== weekStartOf(t) || state.selDay !== t0 ? '<button class="btn small" data-cal="today">Today</button>' : '') +

        var c = 'chip2' + (o.task.done && !o.proj ? ' done' : '') + (!o.task.done && !o.proj && o.at <= t ? ' over' : '') + (o.proj ? ' proj' : '');
        return '<span class="' + c + '" dir="auto"><span class="tm">' + esc(clock(o.at)) + (o.proj ? ' ↻' : '') + '</span>' + esc(o.task.title) + '</span>';
      }).join('');
      if (list.length > 4) chips += '<span class="chip2 more">+' + (list.length - 4) + ' more</span>';
      html += '<button class="' + cls + '" data-day="' + d + '" aria-label="' + esc(dt.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' })) + ', ' + list.length + ' tasks">' +
        '<span class="hd"><span class="dw">' + esc(dt.toLocaleDateString([], { weekday: 'short' })) + '</span><span class="dnum">' + dt.getDate() + '</span></span>' +

    html += '<div class="daylist-head"><h3>' + esc(name) + ', ' + esc(sd.toLocaleDateString([], { day: 'numeric', month: 'short' })) +
      (items.length ? '<span class="count">' + items.length + '</span>' : '') + '</h3>' +

    if (nodate) html += '<p class="nodate">' + nodate + ' task' + (nodate > 1 ? 's' : '') + ' without a date ' + (nodate > 1 ? 'are' : 'is') + ' in the List tab.</p>';

  }

  function setView(v) {

  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) setView(b.dataset.view); });

  $('lists').addEventListener('click', function (e) {

  // open the composer with the chosen day filled in

  // ---- data
  function refresh(quiet) {
    return api('GET', '/api/tasks').then(function (d) {
      state.tasks = d.tasks; state.loaded = true;
      if (!quiet || state.editing == null) render();
      checkDue();
    }).catch(function (e) { if (e.message !== 'unauthorized' && !quiet) toast(e.message); });
  }

  function replaceTask(t) {
    var i = state.tasks.findIndex(function (x) { return x.id === t.id; });

  }

  // ---- composer
  var chosen = null;
  function renderPresets() {
    $('newPresets').innerHTML = presets().map(function (p, i) {
      var on = (p.ts === null && chosen === null && $('newWhen').value === '') ? false : (chosen !== null && p.ts === chosen);
      return '<button type="button" class="preset' + (on ? ' on' : '') + '" data-i="' + i + '">' + esc(p.label) + '</button>';
    }).join('');
  }
  $('newTitle').addEventListener('focus', function () { $('newMore').classList.remove('hidden'); renderPresets(); });
  $('newTitle').addEventListener('input', function () { $('newMore').classList.remove('hidden'); });
  $('newPresets').addEventListener('click', function (e) {
    var b = e.target.closest('.preset'); if (!b) return;
    var p = presets()[Number(b.dataset.i)];
    chosen = p.ts; $('newWhen').value = toLocalInput(p.ts); renderPresets();
  });
  $('newWhen').addEventListener('input', function () { chosen = fromLocalInput($('newWhen').value); renderPresets(); });
  $('newDetails').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('composer').requestSubmit(); });
  $('composer').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('newMore').classList.add('hidden'); document.activeElement.blur(); }
  });
  // "type naturally": the first press of Add lets the AI fill in the fields, the second press saves
  var aiDone = false;
  function hideAiNote() { aiDone = false; $('aiNote').classList.add('hidden'); }
  function aiSummary(p) {
    var bits = [];
    if (p.remind_at != null) bits.push(when(p.remind_at));
    if (p.repeat !== 'none') bits.push(p.repeat === 'daily' ? 'every day' : 'every week');
    if (p.lead_min) bits.push(leadShort(p.lead_min) + ' early heads-up');
    return bits.join(' · ');
  }
  $('newTitle').addEventListener('input', function () { if (!$('newTitle').value.trim()) hideAiNote(); });
  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();

    if (!title) { $('newTitle').focus(); return; }
    var untouched = !$('newWhen').value && !$('newDetails').value.trim() && $('newRepeat').value === 'none' && $('newLead').value === '0';
    if (aiDone || !untouched) return doAdd();
    var btn = $('addBtn'); btn.classList.add('busy'); btn.textContent = 'Thinking…';
    api('POST', '/api/parse', { text: title }).then(function (d) {
      var p = d.parsed || {};
      var nothing = p.remind_at == null && p.repeat === 'none' && !p.lead_min && !p.details && (p.title || '').trim() === title;
      if (nothing) return doAdd();
      $('newTitle').value = p.title || title;
      $('newDetails').value = p.details || '';
      $('newWhen').value = toLocalInput(p.remind_at); chosen = p.remind_at;
      $('newRepeat').value = p.repeat || 'none';
      $('newLead').value = String(p.lead_min || 0);
      $('newMore').classList.remove('hidden'); renderPresets();
      var sum = aiSummary(p), note = $('aiNote');
      var past = p.remind_at != null && p.remind_at <= now() && p.repeat === 'none';
      note.className = 'ai-note' + (past ? ' warn' : '');
      note.textContent = past ? '✨ That time has already passed. Pick a new time, then press Add.'
        : '✨ Got it' + (sum ? ': ' + sum : '') + '. Press Add to save, or change anything first.';
      aiDone = true; $('newTitle').focus();
    }).catch(function () { doAdd(); }).then(function () { btn.classList.remove('busy'); btn.textContent = 'Add'; });
  });
  function doAdd() {
    var title = $('newTitle').value.trim();
    if (!title) return;
    var body ={ title: title, details: $('newDetails').value.trim(), remind_at: fromLocalInput($('newWhen').value), repeat: $('newRepeat').value, lead_min: Number($('newLead').value) };
    if (body.remind_at != null && body.remind_at <= now() - 60000 && body.repeat === 'none') {

    }

  }
  function confirmPast() { toast('That time has already passed. Pick a future time.'); return false; }

  // ---- list actions
  $('lists').addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var host = el.closest('[data-id]'); if (!host) return;

    if (act === 'toggle') toggle(task);
    if (act === 'edit') { state.editing = id; render(); var f = document.querySelector('form.edit input.title'); if (f) f.focus(); }
    if (act === 'cancel') { state.editing = null; render(); }
    if (act === 'delete') {
      api('DELETE', '/api/tasks/' + id).then(function () {
        state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
        state.editing = null; render(); toast('Deleted');
      }).catch(function (e) { toast(e.message); });
    }
  });
  $('lists').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, id = Number(f.dataset.id);
    var body = { title: f.title.value.trim(), details: f.details.value.trim(), remind_at: fromLocalInput(f.when.value), repeat: f.repeat.value, lead_min: Number(f.lead.value) };
    if (!body.title) return;
    api('PATCH', '/api/tasks/' + id, body).then(function (d) {
      replaceTask(d.task); state.editing = null; render(); flash(id); toast('Saved');
    }).catch(function (e) { toast(e.message); });
  });
  $('lists').addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.editing != null) { state.editing = null; render(); }
  });

  function toggle(task) {
    if (!task) return;
    api('PATCH', '/api/tasks/' + task.id, { done: !task.done }).then(function (d) {
      replaceTask(d.task); render();
      if (!task.done && !d.task.done) toast('Done for now · next ' + when(d.task.remind_at));
      else if (d.task.done) toast('Nice, done.');
    }).catch(function (e) { toast(e.message); });
  }

  // ---- in-window alerts while the app is open
  var bannerTask = null;
  function checkDue() {
    var t = now();
    state.tasks.forEach(function (x) {
      if (x.done || x.remind_at == null) return;
      var k = x.id + ':' + x.remind_at;
      // only alert for reminders that come due while this window is open
      if (x.remind_at <= t && x.remind_at > state.openedAt && !state.alerted[k]) {
        state.alerted[k] = true; alertTask(x);
      }
      // early heads-up ("remind me before")
      if (x.lead_min) {
        var e = x.remind_at - x.lead_min * 60000, ek = 'e' + k;
        if (e <= t && x.remind_at > t && e > state.openedAt && !state.alerted[ek]) {
          state.alerted[ek] = true; alertTask(x, 'Coming up ' + rel(x.remind_at));
        }
      }
    });
  }
  function alertTask(x, label) {
    bannerTask = x;
    $('bannerLabel').textContent = label || 'Reminder';
    $('bannerTitle').textContent = x.title;
    $('banner').classList.remove('hidden');
    beep();
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        var n = new Notification((label ? '🔔 ' : '⏰ ') + x.title, { body: label ? label + ' · ' + when(x.remind_at) : (x.details || when(x.remind_at)), icon: '/icon.svg', tag: 'r' + x.id, requireInteraction: true });
        n.onclick = function () { window.focus(); n.close(); };
      }
    } catch (_) {}
    if (state.editing == null) render();
  }
  $('bannerClose').addEventListener('click', function () { $('banner').classList.add('hidden'); });
  $('bannerDone').addEventListener('click', function () {
    $('banner').classList.add('hidden');
    if (bannerTask) toggle(state.tasks.find(function (x) { return x.id === bannerTask.id; }));
  });
  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext; var ctx = new C();
      [0, 0.18].forEach(function (d) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.16);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.18);
      });
    } catch (_) {}
  }

  // ---- settings
  $('settingsBtn').addEventListener('click', function () {
    var s = $('settings'); s.classList.toggle('hidden');
    if (!s.classList.contains('hidden')) { loadTelegram(); renderNotif(); loadBrief(); }
  });

  function loadBrief() {
    api('GET', '/api/brief').then(renderBrief).catch(function () {});
  }
  function renderBrief(b) {
    $('briefOn').checked = !!b.enabled; $('briefTime').value = b.time || '11:00';
    $('briefText').textContent = !b.connected ? 'Connect Telegram above first. Then the bot sends you a short plan every day.'
      : b.enabled ? 'The bot sends today’s tasks, anything overdue, and a tip on what to do first.'
      : 'Off. Turn it on to get a short plan from the bot every day.';
  }
  function saveBrief() {
    api('POST', '/api/brief', { enabled: $('briefOn').checked, time: $('briefTime').value }).then(function (b) {
      renderBrief(b); toast(b.enabled ? 'Morning plan at ' + b.time : 'Morning plan off');
    }).catch(function (e) { toast(e.message); });
  }
  $('briefOn').addEventListener('change', saveBrief);
  $('briefTime').addEventListener('change', saveBrief);
  $('briefTest').addEventListener('click', function () {
    api('POST', '/api/brief/test').then(function () { toast('Sent. Check Telegram.'); }).catch(function (e) { toast(e.message); });
  });
  $('refreshBtn').addEventListener('click', function () { refresh().then(function () { toast('Up to date'); }); });
  $('logoutBtn').addEventListener('click', function () { signOut(); });

  function renderNotif() {
    var p = ('Notification' in window) ? Notification.permission : 'unsupported';
    $('notifText').textContent = p === 'granted' ? 'On. While this window is open you get a pop-up when a reminder is due.'
      : p === 'denied' ? 'Blocked in the browser settings for this site.'
      : p === 'unsupported' ? 'Not supported here. You still get the in-app banner and Telegram.'
      : 'Get a Windows pop-up when a reminder is due while this window is open.';
    $('notifBtn').classList.toggle('hidden', p !== 'default');
  }
  $('notifBtn').addEventListener('click', function () {
    try { Notification.requestPermission().then(renderNotif); } catch (_) {}
  });

  function loadTelegram() {
    $('tgText').textContent = 'Checking…'; $('tgActions').innerHTML = '';
    api('POST', '/api/telegram/setup').catch(function () { return api('GET', '/api/telegram'); }).then(renderTelegram)
      .catch(function (e) { $('tgText').textContent = e.message; });
  }
  function renderTelegram(s) {
    var a = $('tgActions');
    if (!s.configured) { $('tgText').innerHTML = 'The bot token is not set on the server yet. Run the setup script again and paste your BotFather token.'; a.innerHTML = ''; return; }
    if (s.error) { $('tgText').textContent = 'Telegram error: ' + s.error; a.innerHTML = ''; return; }
    if (s.connected) {
      $('tgText').innerHTML = '<span class="status ok"><span class="dot"></span>Connected to @' + esc(s.bot || 'bot') + '</span><br>Due reminders go to your phone even when both PCs are off. You can also message the bot to add tasks.';
      a.innerHTML = '<button class="btn small" id="tgTest">Send test</button><button class="btn small ghost" id="tgOff">Disconnect</button>';
      $('tgTest').onclick = function () { api('POST', '/api/telegram/test').then(function () { toast('Sent. Check your phone.'); }).catch(function (e) { toast(e.message); }); };
      $('tgOff').onclick = function () { api('POST', '/api/telegram/disconnect').then(loadTelegram); };
    } else {
      $('tgText').innerHTML = '<span class="status bad"><span class="dot"></span>Not connected</span><br>Open the link on your iPhone (or scan it from Telegram Desktop), then tap <b>Start</b>.';
      a.innerHTML = '<a class="btn small primary" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(s.link) + '">Connect Telegram</a>' +
        '<button class="btn small" id="tgCopy">Copy link</button><button class="btn small ghost" id="tgRe">I tapped Start</button>';
      $('tgCopy').onclick = function () { try { navigator.clipboard.writeText(s.link); toast('Link copied'); } catch (_) { prompt('Copy this link', s.link); } };
      $('tgRe').onclick = loadTelegram;
    }
  }

  // ---- misc
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 2600);
  }
  function flash(id) {
    var el = document.querySelector('.item[data-id="' + id + '"]');
    if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  // ---- auth flow
  function signOut(msg) {
    store(KEY_STORE, null); state.key = null; state.tasks = []; state.loaded = false;
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginErr').textContent = msg || ''; $('pw').value = ''; $('pw').focus();
  }
  function start() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    state.openedAt = now();
    renderHeader(); render(); refresh();
  }
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var k = $('pw').value.trim(); if (!k) return;
    state.key = k;
    fetch('/api/tasks', { headers: { authorization: 'Bearer ' + k } }).then(function (r) {
      if (r.ok) { store(KEY_STORE, k); start(); }
      else $('loginErr').textContent = r.status === 401 ? 'Wrong password' : 'Server error (' + r.status + ')';
    }).catch(function () { $('loginErr').textContent = 'Could not reach the server. Check your internet.'; });
  });

  state.key = load(KEY_STORE);
  if (state.key) start(); else { $('login').classList.remove('hidden'); $('pw').focus(); }

  // live clock in the header
  setInterval(function () { if (state.key) renderClock(); }, 5000);

  // poll for changes from your other PC / Telegram, and keep times fresh
  setInterval(function () { if (state.key && !document.hidden) refresh(true); }, 30000);
  setInterval(function () { if (state.key) { checkDue(); if (state.editing == null && document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') render(); } }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.key) refresh(true); });
})();
</script>
</body>
</html>
